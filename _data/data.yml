career-profile:
    title: Career Profile
    summary: |
      I am a researcher with a passion for tackling problems at the intersection of AI
      and neuroscience. Currently, I am focusing on depression models in rodents,
      extending computer vision tools from the lab to distinguish between control and
      diseased conditions. I leverage my background in cellular communication and software
      engineering to approach the neurobiology of depression and form an understanding
      of its aspects that impact affect.

education:
    - degree: PhD in Biomedical Engineering
      university: Duke University
      time: 2023 - Present
      details: |
        Developing methods for precise quantification of affect in rodents, to form a
        non-anthropocentric understanding of affective circuits, alongside experimenting with
        foundation models (LLMs) for biologically faithful evidence of affect.
          - GPA 3.86
          - Duke Office of Translation and Commercialization (OTC) Senior Graduate Fellow
    - degree: BTech in Electronics and Communication Engineering
      university: Motilal Nehru National Institute of Technology Allahabad
      time: 2015 - 2019
      details: |
        A 4-year engineering degree with a focus on signals and communication.
          - Thesis: Image Denoising using Blind Source Separation and Neural Networks
          - Digital Signal Processing, Computer Architecture, Mobile Communication Networks

experiences:
    - role: Graduate Student Researcher
      time: Aug 2023 - Present
      company: Dunn Lab, Duke University
      details: |
        - Developing f-DANNCE, an extension of the DANNCE network for facial tracking in freely moving mice
        - Using depression mouse models to record affective reactions with f-DANNCE
        - Mapping between calcium traces and behavior for freely-moving mice
        - Using foundation-model representations to analyze behavior, towards a mechanistic interpretation grounded in biology
    - role: Algorithm Team Lead
      time: Apr 2025 - Present
      company: Liberata
      details: |
        - Developed novel scientometrics to combat inequities in academic publishing through precise contribution tracking
        - Developing novel representations of the academic publishing system
    - role: Senior Graduate Fellow (2025 - Present), Junior Fellow (2024 - 2025)
      time: 2024 - Present
      company: Duke Office of Translation and Commercialization (OTC)
      details: |
        - Conduct technology assessments of software and AI-related invention disclosures
        - Mentor Junior Fellows
    - role: Associate in Research
      time: Feb 2022 - Aug 2023
      company: Dunn Lab, Duke University
      details: |
        - Fine-tuned DANNCE for a novel (patented) behavioral arena, in collaboration with the Tadross Lab
        - Developed unsupervised metrics for estimating goodness of tracking
        - Set up a 6-camera large open-field rig with miniscope-based calcium imaging
    - role: Member of Technical Staff
      time: Jul 2019 - Oct 2021
      company: Oracle
      details: |
        Database High Availability, Data Guard and Fusion Middleware plugins in Oracle Enterprise Manager, in a diverse international team.
          - Enhanced and maintained multiple Standby and Clone Creation Wizards
          - Developed and maintained Service Level Management (ASLM) offerings
          - Worked directly with customer requirements
    - role: Research Intern
      time: Feb 2019 - Jun 2019
      company: ITMR Lab, IIIT Allahabad
      details: |
        EEG-based epileptic seizure detection and emotion classification, including Extreme Learning Machines and dynamic routing in Capsule networks.
    - role: YTL Networks Intern
      time: May 2018 - Jul 2018
      company: Bharti Airtel Ltd.
      details: |
        Presented and demonstrated a database schema to solve entry-mismatches in the progress trackers for Project Junoon.
    - role: Research Intern
      time: Jul 2016 - Mar 2017
      company: DCN Lab, MNNIT Allahabad
      details: |
        Small cell design from the bottom up, with a focus on simulating and prototyping a neutral host femtocell; funded by DIIC, MNNIT.

projects:
    title: Projects
    intro: >
      Research and learning projects along the way.
    assignments:
      - title: Capturing affect in freely moving animals by facial tracking
        link: "#"
        tagline: "LPS-induced and VMAT2-Het mouse models of depression, characterized with DANNCE and f-DANNCE tracking; mentored 3 high-school students across 2 DUNE program years"
      - title: DANNCE finetuning for St3DIO
        link: "#"
        tagline: "Finetuned DANNCE for the St3DIO arenas to reach error margins comparable to inter-annotator disagreement, scaling predictions on terabytes of video to characterize Parkinson Disease mouse models"
      - title: ClinicalIE (Hackathon Project)
        link: "#"
        tagline: "Made a GPT-4 based RAG for metadata prediction from tabular biomedical data"
